<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>East Africa Economic Pulse</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>East Africa Economic Pulse</h1>
    <p class="subtitle">Economic indicators across five East African countries, 2010–2023.</p>

    <main>
        <div class="controls">
            <div class="field">
                <label for="countrySelect">Country</label>
                <select id="countrySelect"></select>
            </div>
            <div class="field">
                <label for="indicatorSelect">Indicator</label>
                <select id="indicatorSelect">
                    <option value="gdp_per_capita">GDP per capita</option>
                    <option value="inflation">Inflation</option>
                    <option value="exchange_rate">Exchange rate</option>
                    <option value="unemployment">Unemployment</option>
                </select>
            </div>
        </div>

        <div class="chart-frame">
            <canvas id="gdp-chart"></canvas>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
